<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 24px;
        }
        .wrap {
            max-width: 700px;
            margin: 0 auto;
        }
        .panel {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 28px rgba(17,24,39,0.08);
            padding: 32px;
        }
        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-bottom: 24px;
            border-bottom: 1px solid #e5e7eb;
        }
        .logo {
            max-width: 280px;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 8px 0;
            line-height: 1.3;
        }
        .meta {
            font-size: 14px;
            color: #6b7280;
            margin: 0;
        }
        .body {
            font-size: 15px;
            color: #374151;
            line-height: 1.7;
            margin: 24px 0;
        }
        .body p {
            margin: 0 0 12px 0;
        }
        .body p:last-child {
            margin-bottom: 0;
        }
        .footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            font-size: 13px;
            color: #6b7280;
            text-align: center;
            line-height: 1.5;
        }
        
        @media (max-width: 640px) {
            body {
                padding: 16px;
            }
            .panel {
                padding: 24px;
            }
            .logo {
                max-width: 220px;
            }
            .title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="panel">
            <div class="header">
                <img class="logo" src="{{LogoCid}}" alt="ArgoX3 Mobile Logo" onerror="this.style.display='none'" />
                <h1 class="title">{{Title}}</h1>
                <p class="meta">Messaggio da {{FromName}}</p>
            </div>
            
            <div class="body">
                {{Content}}
            </div>
            
            <div class="footer">
                © {{Year}} {{FromName}}<br>
                Questa è una email automatica, si prega di non rispondere a questo messaggio.
            </div>
        </div>
    </div>
</body>
</html>
